name: macOS JXA-only AnyDoc validation

on:
  push:
    branches: [main, 'test/**', 'feature/**', 'migration/**']
    paths-ignore:
      - test_report.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anydoc-jxa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Initialize report directory
        if: always()
        run: |
          mkdir -p tests/output
          printf '# macOS JXA 目录转换测试报告\n\n- GitHub Run: %s\n- GitHub SHA: %s\n- Event: %s\n' \
            "${{ github.run_id }}" "${{ github.sha }}" "${{ github.event_name }}" > test_report.md

      - name: Install locked dependencies
        id: deps
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci 2>&1 | tee tests/output/npm-install.log

      - name: Doctor
        id: doctor
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          npm run doctor 2>&1 | tee tests/output/doctor.log

      - name: TypeScript typecheck
        id: types
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee tests/output/typecheck.log

      - name: TypeScript unit and JXA host probe
        id: probes
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:probes 2>&1 | tee tests/output/probes-runner.log

      - name: Real recursive directory conversion Node vs JXA
        id: directory
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:directory 2>&1 | tee tests/output/directory-runner.log

      - name: Always summarize results and failures
        if: always()
        env:
          STAGE_DEPS: ${{ steps.deps.outcome }}
          STAGE_DOCTOR: ${{ steps.doctor.outcome }}
          STAGE_TYPES: ${{ steps.types.outcome }}
          STAGE_PROBES: ${{ steps.probes.outcome }}
          STAGE_DIRECTORY: ${{ steps.directory.outcome }}
        run: |
          node tests/summarize-ci.cjs
          cat test_report.md

      - name: Upload logs, report, and Markdown artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-jxa-directory-validation
          path: |
            test_report.md
            tests/output/
            !tests/output/*.js
          if-no-files-found: warn

      - name: Commit test_report.md to feature branch, including failed results
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/test/') || startsWith(github.ref, 'refs/heads/migration/')) }}
        continue-on-error: true
        env:
          REPORT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f test_report.md ]; then
            printf '# macOS JXA 报告\n\n- FAIL: missing report\n' > test_report.md
          fi
          git add -- test_report.md
          if git diff --cached --quiet; then
            echo "Report unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: update directory test_report.md [skip ci]"
          git push origin "HEAD:refs/heads/${REPORT_BRANCH}"

      - name: Fail job when any required phase failed
        if: always()
        run: |
          test "${{ steps.deps.outcome }}" = success
          test "${{ steps.doctor.outcome }}" = success
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.probes.outcome }}" = success
          test "${{ steps.directory.outcome }}" = success
