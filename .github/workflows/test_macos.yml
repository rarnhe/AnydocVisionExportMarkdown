name: macOS JXA-only AnyDoc validation

on:
  push:
    branches: [main, 'test/**', 'feature/**', 'migration/**']
    paths-ignore:
      - test_report.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anydoc-jxa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install lockfile-pinned dependencies
        id: deps
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p tests/output
          npm ci 2>&1 | tee tests/output/npm-install.log

      - name: Check JXA-only source layout and Node 24 installation
        id: doctor
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          node --version
          npm run doctor 2>&1 | tee tests/output/doctor.log

      - name: TypeScript static typecheck (application and tests)
        id: types
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee tests/output/typecheck.log

      - name: TypeScript unit tests and native JXA capability probe
        id: probes
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:probes 2>&1 | tee tests/output/probes-runner.log

      - name: Recursive directory conversion Node/JXA parity
        id: directory
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:directory 2>&1 | tee tests/output/directory-runner.log

      - name: Complete job and summarize dual-track report
        if: always()
        run: |
          if [ ! -f test_report.md ]; then
            printf '# JXA 测试报告\n\n- FAIL: test runner did not produce a report.