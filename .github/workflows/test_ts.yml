name: macOS persistent JSC singleton validation
on:
  push:
    branches: [main, 'test/**', 'feat/jsc-persistent-wasm-singleton-v3']
    paths-ignore:
      - test_report.md
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: npm ci
      - name: Run batch assertions
        id: checks
        if: always()
        continue-on-error: true
        run: bash tests/test_batch.sh
      - name: Finalize report
        if: always()
        run: |
          test -f test_report.md || printf '# JSC 单例批量测试报告\n\n- 结果：FAIL（测试未启动）\n' > test_report.md
          printf '\n## CI 步骤状态\n- Dependencies: %s\n- Assertions: %s\n' '${{ steps.deps.outcome }}' '${{ steps.checks.outcome }}' >> test_report.md
          cat test_report.md >> "$GITHUB_STEP_SUMMARY"
          cat test_report.md
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macos-persistent-jsc-report
          path: |
            test_report.md
            tests/output/
      - name: Commit report to feature branch without triggering loops
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/feat/jsc-persistent-wasm-singleton-v3' }}
        continue-on-error: true
        run: |
          git add -- test_report.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: update test_report.md [skip ci]"
          git push origin HEAD:refs/heads/feat/jsc-persistent-wasm-singleton-v3
      - name: Fail job when assertions fail
        if: always()
        run: |
          test "${{ steps.deps.outcome }}" = success
          test "${{ steps.checks.outcome }}" = success
