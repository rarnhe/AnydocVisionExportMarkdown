name: macOS batch WASM validation
on:
  push:
    branches: [main, 'feat/**']
    paths-ignore: [test_report.md]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Initialize report
        if: always()
        run: |
          mkdir -p tests/output
          echo '# CI 初始化报告' > test_report.md
      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install --no-save --package-lock=false esbuild @firecrawl/anydoc-wasm tsx
      - name: Test six PDFs in three modes
        id: tests
        if: always()
        continue-on-error: true
        run: bash tests/test_batch.sh
      - name: Publish report
        if: always()
        run: |
          printf '\n## CI 状态\n- Dependencies: %s\n- Tests: %s\n' "${{ steps.deps.outcome }}" "${{ steps.tests.outcome }}" >> test_report.md
          cat test_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macos-batch-test-report
          path: |
            test_report.md
            tests/output/
      - name: Safely write report to feature branch
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/feat/external-wasm-batch-singleton' }}
        continue-on-error: true
        run: |
          git add -- test_report.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: update batch test_report.md [skip ci]'
          git push origin HEAD:refs/heads/feat/external-wasm-batch-singleton
      - name: Fail job when assertions fail
        if: always()
        run: |
          test "${{ steps.deps.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
